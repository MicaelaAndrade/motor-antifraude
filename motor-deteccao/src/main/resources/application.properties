spring.application.name=motor-deteccao

spring.datasource.url=jdbc:postgresql://localhost:5432/antifraude
spring.datasource.username=antifraude
spring.datasource.password=antifraude
spring.jpa.hibernate.ddl-auto=update

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=motor-deteccao

management.endpoints.web.exposure.include=health,prometheus
logging.level.org.springframework.kafka.retrytopic=OFF